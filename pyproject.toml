[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hcc-common"
version = "0.2.1"
description = "Shared library for the HCC detection platform (config, db, storage, bus, schemas)."
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "SQLAlchemy==2.0.50",
    "psycopg==3.3.4",
    "psycopg-binary==3.3.4",
    "alembic==1.18.4",
    "boto3==1.43.24",
    "redis==8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hcc_common*"]
